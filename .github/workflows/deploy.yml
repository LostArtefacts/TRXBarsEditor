name: Deploy

# A push to main builds the editor and hands it to the server, whose deploy
# key runs deploy/update there with the commit. Needs the repository
# variables DEPLOY_HOST and DEPLOY_USER and the secrets DEPLOY_SSH_KEY and
# DEPLOY_KNOWN_HOSTS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
          tar -czf static.tar.gz -C static .

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          trap 'rm -f key known_hosts' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          ssh -i key -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA" < static.tar.gz
